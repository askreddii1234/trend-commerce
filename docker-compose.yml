services:
  api:
    build: ./backend
    environment:
      DJANGO_DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports: ["8000:8080"]
    volumes: ["./backend:/app"]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["3000:8080"]
    depends_on: [api]
